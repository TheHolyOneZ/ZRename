name: Windows installer

# Run this by hand from the Actions tab. It builds only the NSIS installer,
# skipping the tests and the Linux packages, so it is the cheapest way to get a
# Windows build without a Windows machine. Windows runners bill at twice the
# rate of Linux ones, which is why nothing else runs here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the draft release tag, e.g. 0.1.0'
        required: true
        default: '0.1.0'
      draft_release:
        description: 'Also attach the installer to a draft release'
        type: boolean
        required: false
        default: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm tauri build --bundles nsis

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target\release\bundle\nsis |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      # Grab it straight from the run summary if you would rather not bother
      # with a release at all.
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrename-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # A draft release is not public and creates no tag until you publish it,
      # so it is safe to make one, download from it, and delete it again.
      - name: Attach to a draft release
        if: ${{ inputs.draft_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ZRename v${{ inputs.version }}
          draft: true
          prerelease: false
          files: target/release/bundle/nsis/*.exe
          body: |
            Windows installer built from `${{ github.sha }}`.

            Download `ZRename_${{ inputs.version }}_x64-setup.exe`, put it in
            `zrename/releases/`, then delete this draft.
